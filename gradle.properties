# Project-wide Gradle settings
# https://docs.gradle.org/current/userguide/build_environment.html

# JVM memory — Android builds need headroom
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Parallel builds
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# AndroidX — required
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Compose compiler metrics (disable in CI if not needed)
# kotlin.compose.compiler.stabilizationCheck=true

# Non-transitive R classes (best practice for large projects)
android.nonTransitiveRClass=true

# Suppress Gradle deprecation warnings from AGP
android.suppressUnsupportedOptionWarnings=android.suppressUnsupportedOptionWarnings
